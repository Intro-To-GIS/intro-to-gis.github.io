site_name: Intro to GIS
site_description: "An open, interactive learning atlas for GIS concepts, ArcGIS Pro workflows, labs, and readings."
site_author: "Shokran Rahiminezhad"
site_url: "https://intro-to-gis.github.io/"

repo_name: "Intro-To-GIS/intro-to-gis.github.io"
repo_url: "https://github.com/Intro-To-GIS/intro-to-gis.github.io"
edit_uri: "edit/main/docs/"

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/mark.svg
  favicon: assets/images/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

# Parked: kept in the repo, not published. Remove the entry to bring it back.
exclude_docs: |
  courses/
  labs/index.md
  concepts/index.md
  labs/lab-template.md
  labs/lab-01-project-setup.md
  labs/lab-02-attribute-selection.md

plugins:
  # Old URLs from before the site was reorganized. Without these, a saved
  # bookmark or a shared link to a removed page lands on the 404 page.
  - redirects:
      redirect_maps:
        start-here/index.md: lessons/index.md
        troubleshooting/index.md: resources.md
        gis-concepts/index.md: lessons/index.md
        concepts/index.md: lessons/index.md
        data/index.md: resources.md
        labs/index.md: lessons/index.md
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/css/extra.css
  - assets/css/lab-widget.css

extra_javascript:
  - assets/js/lab-widget.js
  - assets/js/lesson-experience.js
  - assets/js/topics-table.js
  - assets/js/sticky-table-header.js
extra:
  course:
    software: "ArcGIS Pro"
    institution: "CUNY"
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/Intro-To-GIS/intro-to-gis.github.io"
      name: "GitHub repository"

copyright: "Open course materials for learning GIS with ArcGIS Pro."

nav:
  - Home: index.md
  - Lessons: lessons/index.md
  - Course Index: lessons/course-index.md
  - Resources: resources.md
  - About: about.md
